Object.assign(choose.style, { border: '1px solid #00D964', borderRadius: '5px', background: 'rgba(255,168,0,0.16)', color: '#FFC24D', padding: '9px 12px', cursor: 'pointer', font: '800 10px IBM Plex Mono, monospace' });
const fallback = document.createElement('button');
fallback.textContent = 'Use embedded fallback';
Object.assign(fallback.style, { border: '1px solid rgba(255,255,255,0.18)', borderRadius: '5px', background: 'transparent', color: '#999999', padding: '9px 12px', cursor: 'pointer', font: '700 10px IBM Plex Mono, monospace' });
const status = document.createElement('div');
Object.assign(status.style, { minHeight: '18px', marginTop: '12px', color: '#FF7A70', fontSize: '10px', lineHeight: '1.5' });
const input = document.createElement('input');
input.type = 'file';
input.accept = '.json,application/json';
input.style.display = 'none';
choose.onclick = function () { input.click(); };
input.onchange = function () {
const file = input.files && input.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = function () {
try {
const data = JSON.parse(String(reader.result || ''));
if (!isCompleteBoffoData(data)) throw new Error('This is not a complete Boffo JSON file.');
applyBoffoData(data);
announceBoffoDataSource('local-file', file.name, data);
overlay.remove();
resolve();
} catch (error) {
status.textContent = 'Could not load ' + file.name + ': ' + error.message;
}
};
reader.onerror = function () { status.textContent = 'The selected file could not be read.'; };
reader.readAsText(file);
};
fallback.onclick = function () { announceBoffoDataSource('embedded-fallback', 'local file preview'); overlay.remove(); resolve(); };
actions.appendChild(choose);
actions.appendChild(fallback);
card.appendChild(actions);
card.appendChild(status);
card.appendChild(input);
overlay.appendChild(card);
document.body.appendChild(overlay);
});
}
async function loadCanonicalBoffoData() {
if (window.location.protocol === 'file:') {
await chooseLocalBoffoJson();
return;
}
try {
const params = new URLSearchParams(window.location.search);
const requestedFile = params.get('data') || 'boffo-data.json';
const url = new URL(requestedFile, window.location.href);
if (url.origin !== window.location.origin) throw new Error('The JSON must be hosted on the same origin as Boffo.');
url.searchParams.set('v', String(Date.now()));
const response = await fetch(url.toString(), { cache: 'no-store', credentials: 'same-origin' });
if (!response.ok) throw new Error('HTTP ' + response.status + ' for ' + url.pathname);
const data = await response.json();
if (!isCompleteBoffoData(data)) throw new Error('The fetched file is not a complete Boffo JSON document.');
applyBoffoData(data);
announceBoffoDataSource('boffo-data.json', url.pathname, data);
} catch (error) {
console.warn('Boffo: canonical JSON could not be loaded; using the embedded emergency fallback.', error);
announceBoffoDataSource('embedded-fallback', error.message);
}
}
const root = ReactDOM.createRoot(document.getElementById('boffo-root'));
let renderGeneration = 0;
function renderBoffo() { renderGeneration += 1; root.render(e(Dashboard, { key: 'boffo-render-' + renderGeneration })); }
window.addEventListener('message', function (event) { if (!event.data || event.data.type !== 'boffo-preview-data') return; applyBoffoData(event.data.data); announceBoffoDataSource('data-studio-preview', 'unsaved Data Studio state', event.data.data); renderBoffo(); window.parent.postMessage({ type: 'boffo-preview-rendered' }, '*'); });
if (new URLSearchParams(window.location.search).get('preview') === '1') { renderBoffo(); window.parent.postMessage({ type: 'boffo-preview-ready' }, '*'); } else { loadCanonicalBoffoData().then(renderBoffo); }
(function () {
function reportHeight() {
const el = document.getElementById('boffo-root');
if (!el) return;
window.parent.postMessage({ type: 'boffo-resize', height: el.scrollHeight }, '*');
}
const observer = new MutationObserver(reportHeight);
observer.observe(document.getElementById('boffo-root'), { childList: true, subtree: true, attributes: true });
window.addEventListener('resize', reportHeight);
window.addEventListener('load', reportHeight);
reportHeight();
setTimeout(reportHeight, 150);
setTimeout(reportHeight, 600);
setTimeout(reportHeight, 1500);
})();
</script>
</body>
